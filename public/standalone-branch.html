<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<title>团支部工作台</title>
<style>
  :root{
    --page:#f4f5f7;--card:#fff;--border:#e5e7eb;--text:#1a1a1a;--text-sub:#6b7280;
    --primary:#c62828;--primary-soft:rgba(198,40,40,.10);--gold:#f9a825;
    --ok:#2e7d32;--warn:#ef6c00;--bad:#c62828;
    --shadow:0 1px 4px rgba(0,0,0,.07);
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  }
  [data-theme="dark"]{
    --page:#0e0f12;--card:#1d1e22;--border:#34363d;--text:#eceef2;--text-sub:#9aa0ab;
    --primary:#ef5350;--primary-soft:rgba(239,83,80,.14);--gold:#ffd54f;
    --shadow:0 1px 4px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--page);color:var(--text);font-size:14px;overscroll-behavior-y:none}
  #app{display:flex;flex-direction:column;height:100%}
  /* ============ 头部 ============ */
  .hdr{background:linear-gradient(135deg,#8e1414,#c62828 55%,#e04040);color:#fff;flex-shrink:0;padding:calc(10px + var(--safe-top)) 14px 12px}
  .hdr-top{display:flex;align-items:center;gap:8px}
  .hdr-flag{font-size:20px}
  .hdr-name{font-size:16px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .hdr-sub{font-size:11px;opacity:.85;margin-top:2px}
  .hdr-acts{display:flex;gap:6px}
  .hdr-btn{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0}
  /* ============ 页体 ============ */
  .page{flex:1;overflow-y:auto;padding:12px 14px calc(84px + var(--safe-bottom));-webkit-overflow-scrolling:touch}
  /* ============ 底部 Tab ============ */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:40}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--text-sub);cursor:pointer;font-size:11px}
  .tab .tico{font-size:19px;filter:grayscale(.5);transition:transform .15s}
  .tab.on{color:var(--primary);font-weight:700}
  .tab.on .tico{filter:none;transform:scale(1.12)}
  /* ============ 卡片 ============ */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .card-title{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .card-title .right{margin-left:auto;font-size:11px;font-weight:400;color:var(--text-sub);cursor:pointer}
  .stat-row{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px;color:var(--primary)}
  .stat span{font-size:11px;color:var(--text-sub)}
  /* 先进性看板 */
  .score-hero{display:flex;align-items:center;gap:14px}
  .score-ring{width:76px;height:76px;flex-shrink:0}
  .score-num{font-size:26px;font-weight:800}
  .score-lv{font-size:13px;font-weight:700;color:var(--gold)}
  .metric{margin-bottom:9px}
  .metric-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .metric-top .req{color:var(--text-sub)}
  .bar{height:8px;background:var(--page);border-radius:4px;overflow:hidden}
  [data-theme="dark"] .bar{background:#2a2c33}
  .bar>i{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .4s}
  .bar>i.done{background:var(--ok)}
  .metric-tag{font-size:11px;color:var(--ok);font-weight:700}
  .metric-tag.no{color:var(--warn)}
  .todo{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:8px 10px;background:var(--primary-soft);border-radius:10px;margin-bottom:6px;color:var(--text)}
  .todo .ti{flex-shrink:0}
  /* chips */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text-sub);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
  /* 留痕卡 */
  .rec{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
  .rec-top{display:flex;align-items:center;gap:8px}
  .rec-type{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;flex-shrink:0}
  .rec-title{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec-photo{font-size:11px;color:var(--text-sub)}
  .rec-meta{font-size:12px;color:var(--text-sub);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .rec-sum{font-size:12.5px;color:var(--text);margin-top:7px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rec-proj{margin-top:7px;font-size:11px;color:var(--primary);font-weight:600}
  /* 团员 */
  .mem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .mem-rank{width:24px;text-align:center;font-size:15px;flex-shrink:0}
  .mem-av{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
  .mem-info{flex:1;min-width:0}
  .mem-name{font-size:14px;font-weight:700}
  .mem-role{font-size:11px;color:var(--text-sub);margin-top:1px}
  .mem-h{text-align:right;flex-shrink:0}
  .mem-h b{color:var(--primary);font-size:16px}
  .mem-h span{display:block;font-size:10px;color:var(--text-sub)}
  .mem-off{opacity:.45}
  /* 立项 */
  .proj{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid var(--primary)}
  .proj-name{font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
  .proj-status{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;flex-shrink:0}
  .ps-declared{background:#e3f2fd;color:#1565c0}
  .ps-active{background:#fff3e0;color:#e65100}
  .ps-done{background:#e8f5e9;color:#2e7d32}
  .proj-meta{font-size:12px;color:var(--text-sub);margin-top:6px}
  .proj-evi{margin-top:8px;font-size:12px;background:var(--primary-soft);border-radius:8px;padding:6px 10px;color:var(--primary);font-weight:600}
  /* 空态 */
  .empty{text-align:center;padding:46px 20px;color:var(--text-sub)}
  .empty .ico{font-size:44px;margin-bottom:10px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
  .empty p{font-size:12px;line-height:1.7}
  /* 悬浮＋ */
  .fab{position:fixed;right:16px;bottom:calc(76px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(198,40,40,.4);cursor:pointer;z-index:35;line-height:1}
  /* 弹窗 */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:80}
  .modal-overlay.show{display:flex}
  .modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column}
  @media(min-width:600px){.modal-overlay{align-items:center}.modal{border-radius:18px;max-height:82%}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .modal-title{font-size:16px;font-weight:800}
  .modal-close{border:none;background:none;font-size:24px;color:var(--text-sub);cursor:pointer;line-height:1}
  .modal-body{padding:14px 16px;overflow-y:auto;flex:1}
  .modal-footer{padding:12px 16px calc(12px + var(--safe-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
  .f-group{margin-bottom:14px}
  .f-label{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:6px;display:block}
  .f-input,.f-select,.f-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--page);color:var(--text);font-size:14px;font-family:inherit}
  [data-theme="dark"] .f-input,[data-theme="dark"] .f-select,[data-theme="dark"] .f-ta{background:#16171b;color-scheme:dark}
  .f-ta{min-height:74px;resize:vertical;line-height:1.6}
  .f-row{display:flex;gap:10px}
  .f-row .f-group{flex:1}
  .type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .type-opt{border:1px solid var(--border);border-radius:10px;padding:9px 4px;text-align:center;font-size:12px;cursor:pointer;background:var(--page);color:var(--text)}
  .type-opt.sel{border-color:var(--primary);background:var(--primary-soft);font-weight:700}
  .type-opt .ti{display:block;font-size:17px;margin-bottom:2px}
  .att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px}
  .att-opt{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 6px;border-radius:7px;cursor:pointer;color:var(--text)}
  .att-opt.on{background:var(--primary-soft);font-weight:700}
  .att-tools{display:flex;gap:8px;margin-bottom:6px}
  .att-mini{font-size:11px;color:var(--primary);cursor:pointer;font-weight:700}
  .photo-row{display:flex;gap:8px;flex-wrap:wrap}
  .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
  .ph-add{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-sub);cursor:pointer;background:var(--page)}
  .check-line{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
  .btn{padding:11px 18px;border-radius:11px;border:none;font-size:14px;font-weight:700;cursor:pointer;flex:1}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-ghost{background:var(--page);color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:#fbe9e7;color:#c62828}
  /* 详情行 */
  .d-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .d-row:last-child{border-bottom:none}
  .d-k{color:var(--text-sub);flex-shrink:0}
  .d-v{text-align:right;color:var(--text)}
  .photos-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos-big img{width:100%;border-radius:10px;border:1px solid var(--border)}
  .att-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .att-tag{font-size:11px;background:var(--page);border:1px solid var(--border);border-radius:999px;padding:3px 9px;color:var(--text)}
  /* 我的 */
  .m-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
  .m-item .mi{font-size:18px;width:26px;text-align:center}
  .m-item .mt{flex:1;font-size:14px;font-weight:600}
  .m-item .ms{font-size:11px;color:var(--text-sub)}
  .m-item .ma{color:var(--text-sub)}
  .m-item.danger .mt{color:var(--bad)}
  /* toast */
  #toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%);background:rgba(30,30,32,.92);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:86%;text-align:center}
  #toast.show{opacity:1}
  .confirm-box{max-width:320px;margin-bottom:auto;margin-top:auto;border-radius:16px}
  .proj-tl{position:relative;padding-left:18px;margin-top:8px}
  .proj-tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
  .tl-item{position:relative;padding:6px 0 10px;font-size:12.5px}
  .tl-item::before{content:'';position:absolute;left:-16px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .tl-item .tl-d{color:var(--text-sub);font-size:11px}
  .note-box{font-size:11.5px;color:var(--text-sub);line-height:1.7;background:var(--page);border-radius:10px;padding:10px 12px}
  /* 月度趋势 */
  .trend{display:flex;align-items:flex-end;gap:8px;height:80px;padding:2px 2px 0}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .trend-bar{width:100%;max-width:30px;height:100%;border-radius:6px 6px 3px 3px;background:var(--primary-soft);position:relative;display:flex;align-items:flex-end}
  .trend-bar>i{display:block;width:100%;border-radius:inherit;background:var(--primary)}
  .trend-n{font-size:10px;font-weight:800;color:var(--primary);text-align:center;position:absolute;top:-14px;left:0;right:0}
  .trend-x{font-size:10px;color:var(--text-sub);margin-top:4px}
  /* 决议 */
  .resol{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;background:var(--page);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;line-height:1.5}
  .resol .rk{cursor:pointer;flex-shrink:0;font-size:14px}
  .resol.done{opacity:.5}
  .resol.done .rt{text-decoration:line-through}
  .resol .rm{margin-left:auto;cursor:pointer;color:var(--text-sub);flex-shrink:0}
  .resol-add{display:flex;gap:8px}
  /* 检查清单 */
  .ck-item{display:flex;gap:9px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px}
  .ck-item:last-child{border-bottom:none}
  .ck-ico{flex-shrink:0;width:22px;text-align:center;font-size:14px}
  .ck-sub{font-size:11px;color:var(--text-sub);margin-top:2px;line-height:1.6}
  /* 团员增强 */
  .mem-goal{height:5px;background:var(--page);border-radius:3px;overflow:hidden;margin-top:6px}
  [data-theme="dark"] .mem-goal{background:#2a2c33}
  .mem-goal>i{display:block;height:100%;background:var(--ok);border-radius:3px}
  .mem-sub{font-size:11px;color:var(--text-sub);margin-top:5px;line-height:1.7}
  .int-badge{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--warn);color:#fff;font-weight:700;flex-shrink:0}
  .tpl-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tpl-chip{font-size:11px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:700}
  .search-box{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:13px;margin-bottom:10px}
  .squad-tag{font-size:10px;background:var(--page);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--text-sub)}
  /* ============ 打印 ============ */
  #printRoot{display:none}
  @media print{
    body>*{display:none !important}
    #printRoot{display:block !important;color:#000}
  }
  @media print{#printRoot *{box-shadow:none !important}}
  #printRoot{font-family:"SimSun","Songti SC",serif}
  #printRoot h1{font-size:20px;text-align:center;margin-bottom:4px}
  #printRoot .pr-sub{text-align:center;font-size:12px;color:#444;margin-bottom:16px}
  #printRoot h2{font-size:15px;margin:16px 0 8px;border-left:4px solid #c62828;padding-left:8px}
  #printRoot table{width:100%;border-collapse:collapse;font-size:12px}
  #printRoot th,#printRoot td{border:1px solid #999;padding:6px 8px;text-align:left}
  #printRoot th{background:#f5f5f5}
  #printRoot .pr-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:13px}
  #printRoot .pr-photo{max-width:200px;max-height:140px;margin:4px 6px 4px 0}
  #printRoot .pr-p{font-size:12.5px;line-height:1.8;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <span class="hdr-flag">🚩</span>
      <div style="flex:1;min-width:0">
        <div class="hdr-name" id="hdrName" onclick="openSettings()">团支部工作台</div>
        <div class="hdr-sub" id="hdrSub">三会两制一课 · 工作留痕</div>
      </div>
      <div class="hdr-acts">
        <button class="hdr-btn" onclick="toggleTheme()" title="夜间模式" id="themeBtn">🌙</button>
        <button class="hdr-btn" onclick="goTab('more')" title="更多">☰</button>
      </div>
    </div>
  </div>
  <div class="page" id="page"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<button class="fab" id="fab" onclick="fabAction()">＋</button>
<div class="modal-overlay" id="modalRoot" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter" style="display:none"></div>
  </div>
</div>
<div id="toast"></div>
<div id="printRoot"></div>
<input type="file" id="photoInput" accept="image/*" multiple style="display:none">
<input type="file" id="importInput" accept="application/json" style="display:none">
<script>
'use strict';
// ==================== 基础 ====================
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,'0')}
function fmtD(s){if(!s)return'—';const p=s.split('-');return +p[1]+'月'+p[2]+'日'}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>showToast('已复制 📋')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('已复制 📋')}catch(e){showToast('复制失败')}ta.remove()}

// ==================== 常量 ====================
const TYPES=[
  {key:'assembly',name:'支部团员大会',icon:'🗳️',color:'#c62828',cat:'三会'},
  {key:'committee',name:'支部委员会',icon:'👥',color:'#ad1457',cat:'三会'},
  {key:'group',name:'团小组会',icon:'🤝',color:'#6a1b9a',cat:'三会'},
  {key:'course',name:'团课',icon:'📖',color:'#1565c0',cat:'一课'},
  {key:'review',name:'教育评议',icon:'📝',color:'#00838f',cat:'两制'},
  {key:'register',name:'团籍注册',icon:'📇',color:'#2e7d32',cat:'两制'},
  {key:'themed',name:'主题团日',icon:'🚩',color:'#e65100',cat:'活动'},
  {key:'volunteer',name:'志愿服务',icon:'💗',color:'#d81b60',cat:'活动',hours:true},
  {key:'project',name:'立项活动',icon:'🏗️',color:'#4527a0',cat:'立项',hours:true},
  {key:'other',name:'其他活动',icon:'📌',color:'#546e7a',cat:'其他'}
];
const typeOf=k=>TYPES.find(t=>t.key===k)||TYPES[9];
const ROLES=['支部书记','副书记','组织委员','宣传委员','纪律委员','团员','入团积极分子'];

// ==================== 学期 ====================
// 学年学期：9-1月=该学年第一学期，2-8月=第二学期；termId 形如 2026-1 / 2026-2
function termOfDate(ds){
  const d=ds?new Date(ds+'T00:00'):new Date();const y=d.getFullYear(),m=d.getMonth()+1;
  if(m>=9)return{id:y+'-1',name:y+'-'+ (y+1) +'学年第一学期',year:y+'-'+(y+1)};
  if(m>=2)return{id:(y-1)+'-2',name:(y-1)+'-'+y+'学年第二学期',year:(y-1)+'-'+y};
  return{id:(y-1)+'-1',name:(y-1)+'-'+y+'学年第一学期',year:(y-1)+'-'+y};
}
function curTerm(){return state.termSel==='auto'?termOfDate():termById(state.termSel)}
function termById(id){
  const y=+id.split('-')[0],s=id.split('-')[1];
  return{id:id,name:y+'-'+(y+1)+'学年第'+(s==='1'?'一':'二')+'学期',year:y+'-'+(y+1)};
}
function termList(){
  const set=new Map();set.set(termOfDate().id,termOfDate());
  // 当前学期前后各一年
  const c=termOfDate();const y=+c.id.split('-')[0];
  for(let k=-1;k<=1;k++){const a=termById((y+k)+'-1'),b=termById((y+k)+'-2');set.set(a.id,a);set.set(b.id,b)}
  state.records.forEach(r=>{if(r.date)set.set(termOfDate(r.date).id,termOfDate(r.date))});
  return[...set.values()].sort((a,b)=>b.id.localeCompare(a.id));
}
function recsTerm(){const t=curTerm();return state.records.filter(r=>r.date&&termOfDate(r.date).id===t.id)}
function recsYear(){const t=curTerm();return state.records.filter(r=>r.date&&termOfDate(r.date).year===t.year)}
function activeMembers(){return state.members.filter(m=>!m.off)}

// ==================== 时长 ====================
function hoursOf(r){return +r.hours||0}
function memberHours(mid){
  let h=0;
  state.records.forEach(r=>{if(r.countsHours&&(r.attendees||[]).includes(mid))h+=hoursOf(r)});
  return Math.round(h*10)/10;
}
function memberHoursYear(mid,year){
  let h=0;
  state.records.forEach(r=>{if(r.countsHours&&(r.attendees||[]).includes(mid)&&r.date&&termOfDate(r.date).year===year)h+=hoursOf(r)});
  return Math.round(h*10)/10;
}
function memberAttend(mid){return state.records.filter(r=>(r.attendees||[]).includes(mid)).length}
// 时长明细：某团员计时长活动列表（倒序）
function memberHourDetail(mid){
  return state.records.filter(r=>r.countsHours&&(r.attendees||[]).includes(mid)&&hoursOf(r)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
// 团小组列表（含未分组）
function squadList(){
  const s=new Set();state.members.forEach(m=>{if(m.squad)s.add(m.squad)});
  return [...s].sort();
}
// 月度活动趋势：本学期各月活动数（按学期起止月切片）
function monthTrend(){
  const t=curTerm(),rt=recsTerm();
  const buckets={};rt.forEach(r=>{const m=(r.date||'').slice(0,7);if(m)buckets[m]=(buckets[m]||0)+1});
  // 学期月份序列：第一学期 9-12+次年1，第二学期 2-7
  const y=+t.id.split('-')[0],s=t.id.split('-')[1];
  const months=s==='1'?[y+'-09',y+'-10',y+'-11',y+'-12',(y+1)+'-01']:[y+'-02',y+'-03',y+'-04',y+'-05',y+'-06',y+'-07'];
  const max=Math.max(1,...months.map(m=>buckets[m]||0));
  return months.map(m=>({m:m,n:buckets[m]||0,pct:Math.round((buckets[m]||0)/max*100)}));
}
// 全部未落实决议（新→旧）
function pendingResolutions(){
  const out=[];
  state.records.forEach(r=>(r.resolutions||[]).forEach(x=>{if(!x.done)out.push({rec:r,res:x})}));
  return out.sort((a,b)=>(b.rec.date||'').localeCompare(a.rec.date||''));
}
// 立项停滞：进行中且最近一次关联留痕距今>21天（或从未有）
function staleProjects(){
  const now=Date.now(),D=21*864e5;
  return state.projects.filter(p=>p.status==='active').filter(p=>{
    const last=state.records.filter(r=>r.projectId===p.id&&r.date).map(r=>new Date(r.date+'T00:00').getTime()).sort((a,b)=>b-a)[0];
    return !last||now-last>D;
  });
}
// 本月缺的三会（支委会/团小组会按月考核）
function missingThisMonth(){
  const m=todayStr().slice(0,7);
  const cnt=k=>state.records.filter(r=>r.type===k&&(r.date||'').startsWith(m)).length;
  const miss=[];
  if(state.meta.goals.committee>0&&!cnt('committee'))miss.push('本月支部委员会未开展');
  if(state.meta.goals.group>0&&!cnt('group'))miss.push('本月团小组会未开展');
  return miss;
}
// 留痕完整性：缺小结/缺照片/缺签到
function integrityStats(){
  const rt=recsTerm();
  const noSum=rt.filter(r=>!(r.summary||'').trim()).length;
  const noPhoto=rt.filter(r=>!(r.photos||[]).length).length;
  const noAtt=rt.filter(r=>!(r.attendees||[]).length&&!r.extra).length;
  return{total:rt.length,noSum:noSum,noPhoto:noPhoto,noAtt:noAtt,
    sumPct:rt.length?Math.round((rt.length-noSum)/rt.length*100):100};
}

// CSV 导出（带 BOM，Excel 直接打开不乱码）
function downloadCsv(name,rows){
  const csv='﻿'+rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
  showToast('已导出 '+name+' 📄');
}

// ==================== 先进性评分 ====================
function scorecard(){
  const g=state.meta.goals,t=curTerm();
  const rt=recsTerm(),ry=recsYear();
  const cnt=(arr,k)=>arr.filter(r=>r.type===k).length;
  const am=activeMembers();
  const hourTotal=ry.reduce((n,r)=>n+(r.countsHours?hoursOf(r)*(r.attendees||[]).length:0),0);
  const perCap=am.length?hourTotal/am.length:0;
  const projOk=state.projects.filter(p=>p.status!=='declared').length;
  const items=[
    {key:'assembly',name:'支部团员大会',done:cnt(rt,'assembly'),need:g.assembly,scope:'每学期',w:15,icon:'🗳️'},
    {key:'committee',name:'支部委员会',done:cnt(rt,'committee'),need:g.committee,scope:'每学期',w:15,icon:'👥'},
    {key:'group',name:'团小组会',done:cnt(rt,'group'),need:g.group,scope:'每学期',w:15,icon:'🤝'},
    {key:'course',name:'团课',done:cnt(rt,'course'),need:g.course,scope:'每学期',w:15,icon:'📖'},
    {key:'review',name:'教育评议',done:cnt(ry,'review'),need:g.review,scope:'每学年',w:10,icon:'📝'},
    {key:'register',name:'团籍注册',done:cnt(ry,'register'),need:g.register,scope:'每学年',w:10,icon:'📇'},
    {key:'volunteer',name:'人均志愿时长',done:Math.round(perCap*10)/10,need:g.hoursPer,scope:'每学年',w:10,icon:'💗',unit:'h'},
    {key:'project',name:'支部立项',done:projOk,need:g.project,scope:'每学年',w:10,icon:'🏗️'}
  ];
  let score=0;
  items.forEach(it=>{it.pct=it.need>0?Math.min(1,it.done/it.need):1;score+=it.pct*it.w});
  score=Math.round(score);
  const lv=score>=90?'⭐⭐⭐⭐⭐ 先进':score>=75?'⭐⭐⭐⭐ 优秀':score>=60?'⭐⭐⭐ 合格':'⭐ 待加强';
  const todos=items.filter(i=>i.pct<1).sort((a,b)=>b.w-a.w).slice(0,3)
    .map(i=>({icon:i.icon,text:i.name+'还需 '+(i.key==='volunteer'?(Math.ceil((i.need-i.done)*10)/10)+'h 人均':(i.need-i.done)+' 次')}));
  return{score,lv,items,todos};
}

    h+='<div class="card"><div class="card-title">⏰ 待办中心<span class="right">'+(pendR.length+miss.length+stale.length)+' 项</span></div>';
    miss.forEach(x=>{h+='<div class="todo"><span class="ti">📅</span><span>'+x+'，点右下角 ＋ 补一条留痕</span></div>'});
    stale.forEach(p=>{h+='<div class="todo"><span class="ti">🏗️</span><span>立项「'+esc(p.name)+'」超 21 天无推进记录</span></div>'});

    h+='<div class="card"><div class="card-title">📈 '+t.name+'活动趋势</div><div class="trend">'

      +'</div></div>';
  }
  const recent=[...state.records].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3);

    h+='<div class="card"><div class="card-title">🕘 最近留痕<span class="right" onclick="goTab(\'records\')">全部 ›</span></div>';

        +'<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600">'+esc(r.title)+'</span>'
        +'<span style="font-size:11px;color:var(--text-sub);flex-shrink:0">'+fmtD(r.date)+'</span></div>';
    });

  }
  if(!state.records.length){
    h+='<div class="empty"><div class="ico">🌱</div><b>还没有留痕</b><p>点右下角 ＋ 记录第一次支部活动<br>或在「我的」里一键填入演示数据体验</p></div>';

function onPhotoPicked(e){
  const files=[...e.target.files].slice(0,3-recPhotos.length);
  files.forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const s=Math.min(1,900/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      recPhotos.push(cv.toDataURL('image/jpeg',0.72));renderRecPhotos();
    };img.src=rd.result};
    rd.readAsDataURL(f);
  });
  e.target.value='';
}

    id:editingRec?editingRec.id:uid('r'),
    type:recTypeSel,title:title,date:date,start:$('rfStart').value,end:$('rfEnd').value,
    location:$('rfLoc').value.trim(),host:$('rfHost').value.trim(),recorder:$('rfRec').value.trim(),

    countsHours:$('rfHoursOn').checked,hours:hours||0,

    h+='<div class="chip-row"><span class="chip'+(state.squadFilter==='all'?' on':'')+'" onclick="state.squadFilter=\'all\';render()">全部</span>'
      +squads.map(s=>'<span class="chip'+(state.squadFilter===s?' on':'')+'" onclick="state.squadFilter=\''+esc(s)+'\';render()">'+esc(s)+'</span>').join('')
      +'<span class="chip'+(state.squadFilter===''?' on':'')+'" onclick="state.squadFilter=\'\';render()">未分组</span></div>';
  }

  const goal=state.meta.goals.hoursPer||0;
  sorted.forEach((m,i)=>{
    const hy=memberHoursYear(m.id,year);
    const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const exp=state.memExpand===m.id;
    h+='<div class="mem" onclick="state.memExpand='+(exp?'null':'\''+m.id+'\'')+';render()">'
      +'<span class="mem-rank">'+rank+'</span>'
      +'<span class="mem-av">'+esc(m.name.slice(0,1))+'</span>'
      +'<div class="mem-info"><div class="mem-name">'+esc(m.name)+(m.squad?' <span class="squad-tag">'+esc(m.squad)+'</span>':'')+'</div><div class="mem-role">'+esc(m.role||'团员')+' · 到场'+memberAttend(m.id)+'次'+(m.joined?' · '+m.joined.slice(0,7)+'入团':'')+'</div>'
      +(exp?memberExpandHtml(m,hy,goal):'')
      +'</div><div class="mem-h"><b>'+hy+'</b><span>小时</span></div></div>';
  });
  if(off.length){
    h+='<div style="font-size:12px;color:var(--text-sub);margin:12px 0 6px">已转出（'+off.length+'）</div>';
    off.forEach(m=>{h+='<div class="mem mem-off"><span class="mem-rank">·</span><span class="mem-av">'+esc(m.name.slice(0,1))+'</span><div class="mem-info"><div class="mem-name">'+esc(m.name)+'</div><div class="mem-role">已转出 · <span style="color:var(--primary);cursor:pointer" onclick="openMemberForm(\''+m.id+'\')">编辑</span> · <span style="cursor:pointer" onclick="restoreMember(\''+m.id+'\')">恢复</span></div></div></div>'});
  }
  return h;
}
function memberExpandHtml(m,hy,goal){
  const detail=memberHourDetail(m.id);
  const pct=goal>0?Math.min(100,Math.round(hy/goal*100)):0;
  let h='<div class="mem-goal"><i style="width:'+pct+'%"></i></div>'
    +'<div class="mem-sub">'+(goal?'学年目标 '+goal+'h · 完成 '+pct+'%':'未设学年目标（去「我的→考核目标」设置）')+' · 累计总时长 '+memberHours(m.id)+'h'
    +(m.awards?'<br>🏅 '+esc(m.awards):'');
  if(detail.length){
    h+='<div style="margin-top:4px">时长明细：</div>';
    detail.slice(0,4).forEach(r=>{h+='<div style="cursor:pointer;color:var(--primary)" onclick="event.stopPropagation();showRecord(\''+r.id+'\')">· '+fmtD(r.date)+' '+esc(r.title)+' <b>+'+hoursOf(r)+'h</b></div>'});

  h+='<div style="margin-top:5px"><span style="color:var(--primary);cursor:pointer" onclick="event.stopPropagation();openMemberForm(\''+m.id+'\')">编辑</span> · <span style="color:var(--bad);cursor:pointer" onclick="event.stopPropagation();delMember(\''+m.id+'\')">'+(m.off?'恢复':'转出')+'</span></div></div>';
  return h;
}

function saveBatch(){
  const lines=$('bfNames').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const exist=new Set(state.members.map(m=>m.name));
  let n=0;
  lines.forEach(ln=>{
    const parts=ln.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    if(!parts[0]||exist.has(parts[0]))return;
    state.members.push({id:uid('m'),name:parts[0],role:ROLES.includes(parts[1])?parts[1]:'团员',squad:parts[2]||(ROLES.includes(parts[1])?'':parts[1]||'')});
    exist.add(parts[0]);n++;
  });
  save();closeModal();render();
  showToast(n?'已导入 '+n+' 名团员 ✓':'没有新姓名（重名已跳过）');
}
function saveMember(){

function exportData(){
  const blob=new Blob([JSON.stringify({app:'branch-desk',version:1,exportedAt:new Date().toISOString(),meta:state.meta,members:state.members,records:state.records,projects:state.projects},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='支部留痕备份-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);
  showToast('已导出备份 📤');
}
function bindImport(){
  $('importInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(d.app!=='branch-desk'||!Array.isArray(d.records))throw 0;
      askConfirm('导入将覆盖现有全部数据（含'+state.records.length+'条留痕），确定？',()=>{
        state.meta=d.meta||state.meta;state.members=d.members||[];state.records=d.records||[];state.projects=d.projects||[];
        save();render();showToast('导入完成 ✓');
      });
    }catch(x){showToast('文件不是有效的备份')}};
    rd.readAsText(f);e.target.value='';
  };
}
function clearAll(){
  askConfirm('清空全部留痕、团员、立项数据？建议先「导出备份」。此操作不可恢复。',()=>{
    state.members=[];state.records=[];state.projects=[];

  });
}

function openModal(title,body,footer){

function applyTheme(){
  let t=state.meta.theme||'';
  if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
  document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  state.meta.theme=cur;save();applyTheme();render();
  showToast(cur==='dark'?'夜间模式 🌙':'日间模式 ☀️');
}
