<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c62828">
  <title>🐔🩸课表</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#c62828;--primary-soft:rgba(198,40,40,0.08);
      --card:#fff;--border:#e5e7eb;--text:#1a1a1a;--text-sub:#6b7280;
      --soft-fg:#f9fafb;--font-scale:1;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{background:#f5f5f5;color:var(--text);font-size:14px}
    #app{height:100%;display:flex;flex-direction:column}

    /* ========== 纯课表模式 ========== */
    .native-mode{display:flex;flex-direction:column;height:100%}
    .native-mode.hidden{display:none}

    /* 周次导航 */
    .week-nav{background:var(--card);padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(8px + var(--safe-top))}
    .week-nav-btn{background:none;border:none;font-size:22px;color:var(--primary);cursor:pointer;padding:4px 8px;font-weight:700}
    .week-nav-info{text-align:center;min-width:100px}
    .week-nav-label{font-size:16px;font-weight:700}
    .week-nav-major{font-size:12px;color:var(--text-sub);margin-top:2px}

    /* 课表表格容器 */
    .table-container{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}

    /* ========== 复制自网站的精确CSS ========== */
    .schedule-table-wrapper{--font-scale:1;position:relative}
    .schedule-table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
    .schedule-table th{border:none;padding:0}
    .schedule-table thead th{border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
    .schedule-table thead th:last-child{border-right:none}
    .period-col{width:38px;background:var(--soft-fg);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
    .period-cell{background:var(--soft-fg);text-align:center;padding:4px 2px;vertical-align:middle;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
    .period-num{font-weight:800;font-size:14px;color:var(--primary);line-height:1.2}
    .period-time{font-size:7px;color:var(--text-sub);line-height:1.1;margin-top:1px}
    .period-time-end{font-size:6.5px;color:var(--text-sub);line-height:1.1}
    .weekday-col{background:var(--soft-fg);font-weight:700;cursor:pointer}
    .weekday-col.weekend{background:#f5f5f5}
    .weekday-col.is-today{background:#dbeafe}
    .weekday-col.is-holiday{background:linear-gradient(180deg,#fef2f2 0%,#fee2e2 100%)}
    .weekday-col.is-holiday .weekday-label{color:#dc2626;font-weight:800}
    .weekday-col.is-makeup{background:linear-gradient(180deg,#fffbeb 0%,#fef3c7 100%)}
    .weekday-col.is-makeup .weekday-label{color:#b45309;font-weight:800}
    .holiday-badge{display:inline-flex;align-items:center;gap:3px;margin:3px auto 5px;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:700;line-height:1.4;white-space:nowrap;letter-spacing:.3px}
    .holiday-badge.holiday{background:#fca5a5;color:#991b1b}
    .holiday-badge.makeup{background:#fbbf24;color:#78350f}
    .holiday-icon{font-size:11px}
    .holiday-text{font-size:9px}
    .holiday-empty-cell{text-align:center;vertical-align:middle;background:repeating-linear-gradient(45deg,#fef2f2,#fef2f2 10px,#fff5f5 10px,#fff5f5 20px);border-left:2px dashed #fca5a5;border-right:2px dashed #fca5a5}
    .holiday-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px}
    .holiday-empty-icon{font-size:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.1))}
    .holiday-empty-text{font-size:14px;font-weight:800;color:#dc2626;letter-spacing:1px}
    .holiday-empty-sub{font-size:11px;color:#9ca3af;font-weight:500}
    .weekday-label{padding:6px 0 0;font-size:12px;font-weight:700}
    .weekday-date{padding:0 0 4px;font-size:9px;color:var(--text-sub)}
    tr[data-period="5"] .course-cell{border-top:1px solid var(--border)}
    tr[data-period="9"] .course-cell{border-top:1px solid var(--border)}
    .course-cell{padding:3px;height:46px;vertical-align:middle;cursor:default;transition:background .15s}
    .course-cell.weekend{background:#fafafa}
    .course-cell.is-today{background:#eff6ff}
    .course-cell.is-holiday-col{background:#fef2f2}
    .course-cell.is-makeup-col{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%)}
    .course-cell.has-course{cursor:pointer}
    .course-cell.has-course:hover{background:var(--primary-soft)}
    .course-cell:not(.has-course):not(.is-holiday-col):not(.holiday-empty-cell){cursor:pointer}
    .course-cell:not(.has-course):not(.is-holiday-col):not(.holiday-empty-cell):hover{background:#f0fdf4;outline:2px dashed #86efac;outline-offset:-2px}
    .course-card{border-left:3px solid;border-radius:4px;padding:4px 8px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--card)}
    .course-card.white{background:var(--card)}
    .course-card.color{backdrop-filter:blur(8px)}
    .course-name{font-weight:700;font-size:calc(11px * var(--font-scale));line-height:1.3;color:var(--text)}
    .course-info{display:flex;flex-direction:column;gap:0}
    .course-location,.course-teacher,.course-weeks{font-size:calc(9px * var(--font-scale));color:var(--text-sub);line-height:1.2}
    .course-weeks{color:var(--primary);font-weight:600}
    .moved-badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;text-align:center;background:linear-gradient(135deg,#ede9fe 0%,#f3e8ff 100%);border-radius:6px;border-left:3px solid #7c3aed;height:100%;justify-content:center;cursor:pointer;transition:all .15s;box-sizing:border-box}
    .moved-badge:hover{background:linear-gradient(135deg,#ddd6fe 0%,#e9d5ff 100%);transform:scale(1.02)}
    .moved-icon{font-size:18px}
    .moved-text{font-size:10px;font-weight:700;color:#6d28d9;line-height:1.3}
    .moved-loc{font-size:9px;font-weight:600;color:#7c3aed;background:#ede9fe;padding:2px 6px;border-radius:3px}
    .time-line{position:absolute;height:2px;background:#ef4444;z-index:10;pointer-events:none}
    .time-line::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;background:#ef4444;border-radius:50%}
    .time-label{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px 0 0 4px;white-space:nowrap}

    /* 底部栏 */
    .bottom-bar{background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-bottom));flex-shrink:0}
    .bottom-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-sub);cursor:pointer;padding:4px 12px}
    .bottom-btn .icon{font-size:20px}
    .bottom-btn.active{color:var(--primary)}

    /* ========== 弹窗 ========== */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:flex-end;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow:hidden;animation:slideUp .3s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modal-title{font-size:16px;font-weight:700}
    .modal-close{background:none;border:none;font-size:24px;color:var(--text-sub);cursor:pointer}
    .modal-body{padding:16px;overflow-y:auto;max-height:calc(80vh - 60px)}
    .modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:12px}
    .modal-footer .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .modal-footer .btn-primary{background:var(--primary);color:#fff}
    .modal-footer .btn-secondary{background:var(--border);color:var(--text)}

    /* 更多菜单 */
    .menu-list{list-style:none}
    .menu-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);cursor:pointer}
    .menu-item:active{background:#f5f5f5}
    .menu-item .icon{font-size:20px;width:28px;text-align:center}
    .menu-item .text{flex:1;font-size:14px}
    .menu-item .arrow{color:var(--text-sub)}

    /* 搜索 */
    .search-box{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
    .search-box:focus{border-color:var(--primary)}

    /* 专业选择 */
    .major-list{list-style:none}
    .major-item{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);cursor:pointer}
    .major-item.selected{background:rgba(198,40,40,0.1)}
    .major-item .dot{width:12px;height:12px;border-radius:50%}
    .major-item .name{flex:1;font-size:14px}
    .major-item .check{color:var(--primary);font-size:18px;display:none}
    .major-item.selected .check{display:block}

    /* 类型筛选 */
    .filter-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
    .filter-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;cursor:pointer;background:var(--card)}
    .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* 字体大小滑块 */
    .font-slider{width:100%;margin:12px 0}
    .font-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub)}

    /* 彩色/白色模式 */
    .color-toggle{display:flex;gap:12px;margin:12px 0}
    .color-option{flex:1;padding:12px;border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer}
    .color-option.active{border-color:var(--primary);background:rgba(198,40,40,0.05)}

    /* 课程详情 */
    .detail-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
    .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
    .detail-row:last-child{border-bottom:none}
    .detail-label{color:var(--text-sub);font-size:13px}
    .detail-value{font-size:14px;font-weight:500}

    /* 添加/编辑表单 */
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:13px;color:var(--text-sub);margin-bottom:6px}
    .form-input,.form-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
    .form-input:focus,.form-select:focus{border-color:var(--primary)}
    .form-row{display:flex;gap:12px}
    .form-row .form-group{flex:1}

    /* Toast */
    .toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
    .toast.show{opacity:1}

    /* 确认框 */
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1500;display:none;align-items:center;justify-content:center}
    .confirm-overlay.show{display:flex}
    .confirm-box{background:var(--card);border-radius:12px;padding:20px;width:280px;text-align:center}
    .confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
    .confirm-msg{font-size:14px;color:var(--text-sub);margin-bottom:20px;line-height:1.5}
    .confirm-btns{display:flex;gap:12px}
    .confirm-btns .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

    /* ========== 网页版模式 ========== */
    .web-mode{display:none;flex-direction:column;height:100%}
    .web-mode.show{display:flex}
    .web-header{background:linear-gradient(135deg,var(--primary),#ad1457);color:#fff;padding:calc(8px + var(--safe-top)) 12px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .web-back{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
    .web-title{font-size:15px;font-weight:700;flex:1;text-align:center}
    .web-frame{flex:1;border:none;width:100%;background:#f5f5f5}
    .web-error{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-sub);padding:20px;text-align:center}
    .web-error-icon{font-size:48px}
    .web-error-text{font-size:14px}

    /* 滚动条 */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}

    /* 手机端优化 */
    @media (max-width:640px){
      .period-col{width:30px}
      .period-cell{padding:3px 2px}
      .period-num{font-size:calc(12px * var(--font-scale))}
      .period-time{font-size:calc(6px * var(--font-scale))}
      .period-time-end{font-size:calc(5.5px * var(--font-scale))}
      .course-cell{height:44px;padding:2px}
      .course-card{padding:3px 5px}
      .course-name{font-size:calc(10px * var(--font-scale))}
      .course-location,.course-teacher{font-size:calc(8px * var(--font-scale))}
      .holiday-badge{padding:1px 4px;font-size:8px;gap:1px;margin:2px auto 3px}
      .holiday-icon{font-size:9px}
      .holiday-text{font-size:8px}
      .moved-badge{padding:4px;gap:2px}
      .moved-icon{font-size:14px}
      .moved-text{font-size:9px}
      .moved-loc{font-size:8px;padding:1px 4px}
      .holiday-empty-icon{font-size:24px}
      .holiday-empty-text{font-size:12px}
      .time-line::before{width:8px;height:8px;left:-4px;top:-3px}
      .time-label{font-size:9px;padding:1px 4px;border-radius:3px 0 0 3px}
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ==================== 纯课表模式 ==================== -->
    <div class="native-mode" id="nativeMode">
      <!-- 周次导航 -->
      <div class="week-nav">
        <button class="week-nav-btn" onclick="prevWeek()">‹</button>
        <div class="week-nav-info">
          <div class="week-nav-label" id="weekLabel">第1周</div>
          <div class="week-nav-major" id="majorLabel">计科学硕</div>
        </div>
        <button class="week-nav-btn" onclick="nextWeek()">›</button>
      </div>

      <!-- 课表表格 -->
      <div class="table-container" id="tableContainer">
        <div class="schedule-table-wrapper" id="tableWrapper">
          <table class="schedule-table" id="scheduleTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="timeLine" class="time-line" style="display:none">
            <span class="time-label" id="timeLineLabel"></span>
          </div>
        </div>
      </div>

      <!-- 底部快捷栏 -->
      <div class="bottom-bar">
        <button class="bottom-btn" onclick="goToday()">
          <span class="icon">📍</span>
          <span>本周</span>
        </button>
        <button class="bottom-btn" onclick="takeScreenshot()">
          <span class="icon">📷</span>
          <span>截图</span>
        </button>
        <button class="bottom-btn" onclick="showAddModal()">
          <span class="icon">➕</span>
          <span>添加</span>
        </button>
        <button class="bottom-btn" onclick="showMoreMenu()">
          <span class="icon">⚙️</span>
          <span>菜单</span>
        </button>
      </div>
    </div>

    <!-- ==================== 网页版模式 ==================== -->
    <div class="web-mode" id="webMode">
      <div class="web-header">
        <button class="web-back" onclick="backToNative()">← 返回课表</button>
        <div class="web-title">🌐 网页版课表</div>
      </div>
      <iframe class="web-frame" id="webFrame" src="about:blank" allow="fullscreen"></iframe>
      <div class="web-error" id="webError" style="display:none">
        <div class="web-error-icon">📡</div>
        <div class="web-error-text">网络连接失败，请检查网络后重试</div>
        <button class="web-back" onclick="retryWeb()">🔄 重试</button>
      </div>
    </div>

    <!-- ==================== 弹窗 ==================== -->
    <!-- 更多菜单 -->
    <div class="modal-overlay" id="moreMenu">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">菜单</div>
          <button class="modal-close" onclick="closeMoreMenu()">×</button>
        </div>
        <div class="modal-body">
          <ul class="menu-list">
            <li class="menu-item" onclick="switchToWeb()">
              <span class="icon">📄</span><span class="text">切换网页版</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="showMajorModal()">
              <span class="icon">🎓</span><span class="text">选择专业</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="showSearchModal()">
              <span class="icon">🔍</span><span class="text">搜索课程</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="showFilterModal()">
              <span class="icon">🏷️</span><span class="text">类型筛选</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="showColorModal()">
              <span class="icon">🎨</span><span class="text">彩色/白色模式</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="showFontModal()">
              <span class="icon">🔤</span><span class="text">字体缩放</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="exportData()">
              <span class="icon">📤</span><span class="text">导出数据</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="importData()">
              <span class="icon">📥</span><span class="text">导入数据</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="checkUpdate()">
              <span class="icon">🔄</span><span class="text">检查更新</span><span class="arrow">›</span>
            </li>
            <li class="menu-item" onclick="resetData()">
              <span class="icon">🔄</span><span class="text">恢复默认</span><span class="arrow">›</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 专业选择 -->
    <div class="modal-overlay" id="majorModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">选择专业</div>
          <button class="modal-close" onclick="closeMajorModal()">×</button>
        </div>
        <div class="modal-body">
          <ul class="major-list" id="majorList"></ul>
        </div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="modal-overlay" id="searchModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">搜索课程</div>
          <button class="modal-close" onclick="closeSearchModal()">×</button>
        </div>
        <div class="modal-body">
          <input type="text" class="search-box" id="searchInput" placeholder="输入课程名称、教师或教室" oninput="searchCourses()">
          <div id="searchResults" style="margin-top:12px"></div>
        </div>
      </div>
    </div>

    <!-- 类型筛选 -->
    <div class="modal-overlay" id="filterModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">类型筛选</div>
          <button class="modal-close" onclick="closeFilterModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="filter-chips" id="filterChips"></div>
        </div>
      </div>
    </div>

    <!-- 颜色模式 -->
    <div class="modal-overlay" id="colorModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">显示模式</div>
          <button class="modal-close" onclick="closeColorModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="color-toggle">
            <div class="color-option" id="colorModeBtn" onclick="setColorMode('color')">
              <div style="font-size:24px;margin-bottom:4px">🌈</div>
              <div style="font-size:13px">彩色模式</div>
            </div>
            <div class="color-option" id="whiteModeBtn" onclick="setColorMode('white')">
              <div style="font-size:24px;margin-bottom:4px">⬜</div>
              <div style="font-size:13px">白色模式</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 字体大小 -->
    <div class="modal-overlay" id="fontModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">字体大小</div>
          <button class="modal-close" onclick="closeFontModal()">×</button>
        </div>
        <div class="modal-body">

// ==================== 工具函数 ====================
function getWeekNumber(date){return Math.floor((date-state.semesterStart)/(7*864e5))+1}
function getCurrentWeek(){return Math.max(1,Math.min(18,getWeekNumber(new Date())))}
function getDateStr(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function getWeekDates(week){
  const start=new Date(state.semesterStart);start.setDate(start.getDate()+(week-1)*7);
  const dates=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);dates.push(d)}
  return dates;
}
function isInWeeks(weeksStr,week){
  if(!weeksStr)return true;
  const parts=weeksStr.split(',').map(s=>s.trim());
  for(const part of parts){
    if(part.includes('-')){const[a,b]=part.split('-').map(Number);if(week>=a&&week<=b)return true}
    else{if(parseInt(part)===week)return true}
  }
  return false;
}
function getCoursesForWeek(major,week){
  const base=(ALL_COURSES[major]||[]).filter(c=>!state.deletedCourses.includes(c.id));
  const custom=state.customCourses.filter(c=>c.major===major&&isInWeeks(c.weeks,week));
  return[...base,...custom].filter(c=>isInWeeks(c.weeks,week));
}
function getDayType(dateStr){return state.dayOverrides[dateStr]||HOLIDAY_MAP[dateStr]||null}
function getScheduleWeekday(dateStr,dayType){
  if(dayType&&dayType.type==='makeup')return dayType.scheduleWeekday;
  const d=new Date(dateStr);const day=d.getDay();return day===0?7:day;
}

  const now=new Date();const h=now.getHours(),m=now.getMinutes();const t=h*60+m;
  if(t<500||t>=1320||!isTodayColumn()){el.style.display='none';return}
  el.style.display='';
  label.textContent=h+':'+String(m).padStart(2,'0');
  const table=document.getElementById('scheduleTable');
  const wrapper=document.getElementById('tableWrapper');
  if(!table||!wrapper)return;
  const thead=table.querySelector('thead');
  if(!thead)return;
  const headerBottom=thead.getBoundingClientRect().bottom-wrapper.getBoundingClientRect().top;
  for(const b of PERIOD_BOUNDS){
    if(t>=b.start&&t<b.end){
      const tr=table.querySelector('tr[data-period="'+b.row+'"]');
      if(!tr)return;
      const trTop=tr.getBoundingClientRect().top-wrapper.getBoundingClientRect().top;
      const trH=tr.offsetHeight;
      const progress=(t-b.start)/(b.end-b.start);
      el.style.top=(trTop+progress*trH)+'px';
      const periodCol=table.querySelector('.period-col');
      const todayIdx=getTodayIndex();
      if(periodCol&&todayIdx>=0){
        const cols=table.querySelectorAll('.weekday-col');
        if(cols[todayIdx]){
          el.style.left=cols[todayIdx].offsetLeft+'px';
          el.style.width=cols[todayIdx].offsetWidth+'px';
        }
      }
      return;
    }
  }
  for(let i=PERIOD_BOUNDS.length-1;i>=0;i--){
    if(t>=PERIOD_BOUNDS[i].end){
      const tr=table.querySelector('tr[data-period="'+PERIOD_BOUNDS[i].row+'"]');
      if(!tr)return;
      const trTop=tr.getBoundingClientRect().top-wrapper.getBoundingClientRect().top;
      el.style.top=(trTop+tr.offsetHeight)+'px';
      const periodCol=table.querySelector('.period-col');
      const todayIdx=getTodayIndex();
      if(periodCol&&todayIdx>=0){
        const cols=table.querySelectorAll('.weekday-col');
        if(cols[todayIdx]){
          el.style.left=cols[todayIdx].offsetLeft+'px';
          el.style.width=cols[todayIdx].offsetWidth+'px';
        }
      }
      return;
    }
  }
  el.style.display='none';
}
function isTodayColumn(){
  const today=new Date();const td=today.getDay()===0?7:today.getDay();
  const weekDates=getWeekDates(state.selectedWeek);
  for(let i=0;i<7;i++){
    if(getDateStr(weekDates[i])===getDateStr(today))return true;
  }
  return false;
}
function getTodayIndex(){
  const today=new Date();const todayStr=getDateStr(today);
  const weekDates=getWeekDates(state.selectedWeek);
  for(let i=0;i<7;i++){if(getDateStr(weekDates[i])===todayStr)return i}
  return -1;
}

function renderTable(){
  const week=state.selectedWeek;
  const courses=getCoursesForWeek(state.selectedMajor,week);

  const weekDates=getWeekDates(week);
  const todayIdx=getTodayIndex();
  let headHtml='<tr><th class="period-col">节</th>';
  WEEKDAYS.forEach((wd,idx)=>{
    const ds=getDateStr(weekDates[idx]);
    const dt=getDayType(ds);
    let cls='weekday-col';
    if(wd.key>=6)cls+=' weekend';
    if(ds===todayStr&&week===getCurrentWeek())cls+=' is-today';
    if(dt&&dt.type==='holiday')cls+=' is-holiday';
    if(dt&&dt.type==='makeup')cls+=' is-makeup';
    const dateLabel=(weekDates[idx].getMonth()+1)+'/'+weekDates[idx].getDate();
    headHtml+='<th class="'+cls+'" onclick="showOverrideModal(\''+ds+'\')">';
    headHtml+='<div class="weekday-label">'+wd.short+'</div>';
    headHtml+='<div class="weekday-date">'+dateLabel+'</div>';
    if(dt){
      const badgeCls=dt.type;
      const text=dt.type==='holiday'?dt.name:(dt.descShort||dt.desc);
      headHtml+='<div class="holiday-badge '+badgeCls+'"><span class="holiday-icon">'+dt.icon+'</span><span class="holiday-text">'+text+'</span></div>';
    }
    headHtml+='</th>';
  });
  headHtml+='</tr>';
  document.getElementById('tableHead').innerHTML=headHtml;
  const merged=new Set();
  let bodyHtml='';
  TABLE_ROWS.forEach(row=>{
    bodyHtml+='<tr class="section-'+row.section+'" data-period="'+row.period+'">';
    bodyHtml+='<td class="period-cell"><div class="period-num">'+row.label+'</div><div class="period-time">'+row.time+'</div><div class="period-time-end">'+row.timeEnd+'</div></td>';
    WEEKDAYS.forEach((wd,idx)=>{
      const key=wd.key+'-'+row.period;
      if(merged.has(key))return;
      const ds=getDateStr(weekDates[idx]);
      const dt=getDayType(ds);
      const isHol=dt&&dt.type==='holiday';
      const isMak=dt&&dt.type==='makeup';
      const isTod=ds===todayStr&&week===getCurrentWeek();
      if(isHol&&row.period===1){
        merged.add(key);
        const holName=dt.name||'假期';
        bodyHtml+='<td rowspan="12" class="course-cell is-holiday-col holiday-empty-cell">';
        bodyHtml+='<div class="holiday-empty"><span class="holiday-empty-icon">🎉</span><span class="holiday-empty-text">'+holName+'</span><span class="holiday-empty-sub">假期停课</span></div>';
        bodyHtml+='</td>';
        return;
      }
      if(isHol)return;
      const effectiveWd=isMak?dt.scheduleWeekday:wd.key;
      const course=courses.find(c=>c.weekday===effectiveWd&&row.period>=c.startPeriod&&row.period<=c.endPeriod);
      const override=getOverride(ds,row.period);
      // 检查是否有调入课程（从其他日期调来）
      let incoming=null;
      for(const key of Object.keys(HOLIDAY_MAP)){
        const hdt=HOLIDAY_MAP[key];
        if(!hdt||!hdt.overrides)continue;
        for(const ov of hdt.overrides){
          if(ov.destDate===ds&&row.period>=ov.destPeriods[0]&&row.period<=ov.destPeriods.at(-1)){
            const srcWd=hdt.scheduleWeekday;
            const srcCourse=courses.find(c=>c.weekday===srcWd&&ov.srcPeriods[0]>=c.startPeriod&&ov.srcPeriods[0]<=c.endPeriod);
            if(srcCourse)incoming={course:srcCourse,srcDate:key,srcPeriods:ov.srcPeriods,destLocation:ov.destLocation};
          }
        }
      }
      if(incoming&&row.period===incoming.srcPeriods[0]){
        const span=incoming.srcPeriods.length;
        incoming.srcPeriods.forEach(p=>merged.add(wd.key+'-'+p));
        let cls='course-cell has-course';
        if(wd.key>=6)cls+=' weekend';
        if(isTod)cls+=' is-today';
        if(isMak)cls+=' is-makeup-col';
        bodyHtml+='<td rowspan="'+span+'" class="'+cls+'">';
        bodyHtml+='<div class="course-card" style="border-left-style:dashed;border-left-color:#0369a1;background:#e0f2fe">';
        bodyHtml+='<div class="incoming-badge" style="font-size:8px;font-weight:700;color:#0369a1;background:#bae6fd;padding:1px 4px;border-radius:3px;margin-bottom:2px">⬅️ 调入 '+incoming.srcDate.slice(5)+'第'+incoming.srcPeriods[0]+'节</div>';
        bodyHtml+='<div class="course-name">'+incoming.course.name+'</div>';
        bodyHtml+='<div class="course-info"><span class="course-location" style="color:#dc2626;font-weight:700">'+incoming.destLocation+'</span>';
        bodyHtml+='<span class="course-teacher">'+incoming.course.teacher+'</span></div></div></td>';
      } else if(override&&row.period===override.srcPeriods[0]){
        const span=override.srcPeriods.length;
        override.srcPeriods.forEach(p=>merged.add(wd.key+'-'+p));
        let cls='course-cell has-course';
        if(wd.key>=6)cls+=' weekend';
        if(isTod)cls+=' is-today';
        if(isMak)cls+=' is-makeup-col';
        bodyHtml+='<td rowspan="'+span+'" class="'+cls+'" onclick="showOverrideDetail(\''+ds+'\','+row.period+')">';
        bodyHtml+='<div class="moved-badge"><span class="moved-icon">↗️</span>';
        bodyHtml+='<span class="moved-text">'+override.destDate.slice(5)+' 第'+override.destPeriods[0]+'-'+override.destPeriods.at(-1)+'节</span>';
        bodyHtml+='<span class="moved-loc">📍'+override.destLocation+'</span></div></td>';
      } else if(course&&row.period===course.startPeriod){
        const span=course.endPeriod-course.startPeriod+1;
        for(let p=course.startPeriod;p<=course.endPeriod;p++)merged.add(wd.key+'-'+p);
        const color=state.colorMode==='color'?(course.color||'#999'):'#666';
        const bg=state.colorMode==='color'?'rgba('+parseInt(color.slice(1,3),16)+','+parseInt(color.slice(3,5),16)+','+parseInt(color.slice(5,7),16)+',0.15)':'var(--card)';
        let cls='course-cell has-course';
        if(wd.key>=6)cls+=' weekend';
        if(isTod)cls+=' is-today';
        if(isMak)cls+=' is-makeup-col';
        bodyHtml+='<td rowspan="'+span+'" class="'+cls+'" onclick="showDetail(\''+course.id+'\')">';
        bodyHtml+='<div class="course-card" style="background:'+bg+';border-left-color:'+color+'">';
        bodyHtml+='<div class="course-name">'+course.name+'</div>';
        bodyHtml+='<div class="course-info"><span class="course-location">'+course.location+'</span>';
        bodyHtml+='<span class="course-teacher">'+course.teacher+'</span></div>';
        if(isMak)bodyHtml+='<span style="position:absolute;top:2px;right:4px;font-size:10px;background:#fbbf24;color:#78350f;padding:1px 4px;border-radius:8px">📅 补</span>';
        bodyHtml+='</div></td>';
      } else if(course&&row.period>course.startPeriod&&row.period<=course.endPeriod){
        // merged, skip
      } else {
        let cls='course-cell';
        if(wd.key>=6)cls+=' weekend';
        if(isTod)cls+=' is-today';
        if(isMak)cls+=' is-makeup-col';
        bodyHtml+='<td class="'+cls+'" onclick="showAddModalForCell('+wd.key+','+row.period+')">';
        if(isMak){
          bodyHtml+='<div class="course-card" style="border-left-color:transparent;cursor:pointer"></div>';
        } else {
          bodyHtml+='<div class="course-card" style="border-left-color:transparent;cursor:pointer"></div>';
        }
        bodyHtml+='</td>';
      }
    });
    bodyHtml+='</tr>';
  });
  document.getElementById('tableBody').innerHTML=bodyHtml;
}

let touchStartX=0,touchStartY=0,touchStartTime=0;
const tableEl=document.getElementById('tableContainer');
tableEl.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
  tableEl.style.transition='none';
},{passive:true});
tableEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50&&dt<300){
    tableEl.style.transition='transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';
    tableEl.style.transform='translateX('+(dx>0?30:-30)+'px)';
    setTimeout(()=>{tableEl.style.transform='';},150);
    if(dx>0)prevWeek();else nextWeek();
  }
},{passive:true});

// ==================== 停课/调休 ====================
function getOverride(dateStr,period){
  const dt=HOLIDAY_MAP[dateStr];
  if(dt&&dt.overrides){
    for(const o of dt.overrides){
      if(o.srcPeriods&&o.srcPeriods.includes(period))return o;
    }
  }
  return null;
}
function showOverrideDetail(dateStr,period){
  const o=getOverride(dateStr,period);
  if(!o)return;
  const modal=document.getElementById('detailModal');
  modal.querySelector('.modal-title').textContent='↗️ 调课通知';
  let html='<div class="detail-row"><span class="detail-label">原日期</span><span class="detail-value">'+dateStr+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">原节次</span><span class="detail-value">第'+o.srcPeriods[0]+'-'+o.srcPeriods.at(-1)+'节</span></div>';
  html+='<div class="detail-row"><span class="detail-label">调至日期</span><span class="detail-value">'+o.destDate+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">调至节次</span><span class="detail-value">第'+o.destPeriods[0]+'-'+o.destPeriods.at(-1)+'节</span></div>';
  html+='<div class="detail-row"><span class="detail-label">上课地点</span><span class="detail-value">'+o.destLocation+'</span></div>';
  if(o.courseHint)html+='<div class="detail-row"><span class="detail-label">课程</span><span class="detail-value">'+o.courseHint+'</span></div>';
  modal.querySelector('#detailContent').innerHTML=html;
  modal.querySelector('.modal-footer').innerHTML='<button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>';
  modal.classList.add('show');
}
let overrideDate=null;
function showOverrideModal(dateStr){
  overrideDate=dateStr;
  document.getElementById('overrideDate').value=dateStr;
  const existing=state.dayOverrides[dateStr]||HOLIDAY_MAP[dateStr];
  document.getElementById('overrideType').value=existing?existing.type:'none';
  updateOverrideUI();
  document.getElementById('overrideModal').classList.add('show');
}
function closeOverrideModal(){document.getElementById('overrideModal').classList.remove('show')}
function updateOverrideUI(){
  const type=document.getElementById('overrideType').value;
  document.getElementById('makeupWeekdayGroup').style.display=type==='makeup'?'block':'none';
}
function saveOverride(){
  const type=document.getElementById('overrideType').value;
  if(type==='none'){delete state.dayOverrides[overrideDate]}
  else{
    state.dayOverrides[overrideDate]={
      type:type,
      scheduleWeekday:type==='makeup'?parseInt(document.getElementById('makeupWeekday').value):undefined,
      icon:type==='holiday'?'🎉':'📅',
      name:type==='holiday'?'节假日':'调休'
    };
  }
  saveState();closeOverrideModal();render();showToast('已更新');
}

// ==================== 数据导入导出 ====================
function exportData(){
  closeMoreMenu();
  const data={customCourses:state.customCourses,deletedCourses:state.deletedCourses,dayOverrides:state.dayOverrides,selectedMajor:state.selectedMajor,exportTime:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='schedule-'+getDateStr(new Date())+'.json';a.click();URL.revokeObjectURL(url);
  showToast('导出成功');
}
function importData(){
  closeMoreMenu();
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.customCourses)state.customCourses=data.customCourses;
        if(data.deletedCourses)state.deletedCourses=data.deletedCourses;
        if(data.dayOverrides)state.dayOverrides=data.dayOverrides;
        if(data.selectedMajor)state.selectedMajor=data.selectedMajor;
        saveState();render();showToast('导入成功');
      }catch(err){showToast('导入失败：文件格式错误')}
    };
    reader.readAsText(file);
  };
  input.click();
}

// ==================== 检查更新 ====================
function checkUpdate(){
  closeMoreMenu();
  showToast('正在检查更新...');
  fetch('https://icyteacn.github.io/FJNU-Nav/data/schedule-courses.json')
    .then(r=>{if(!r.ok)throw new Error('not found');return r.json()})
    .then(data=>{
      if(data&&data.courses){
        const localVersion=localStorage.getItem('sche_data_version')||'';
        const remoteVersion=data.version||'';
        const remoteTime=data.updatedAt||'';
        const lastUpdate=localStorage.getItem('sche_last_update')||'';
        if(remoteTime&&remoteTime!==lastUpdate){
          showConfirm('发现更新','发现新的课表数据（'+data.courses.length+'门课程），是否更新？',()=>{
            const updated={};
            data.courses.forEach(c=>{
              if(!updated[c.major])updated[c.major]=[];
              updated[c.major].push(c);
            });
            Object.keys(updated).forEach(m=>{ALL_COURSES[m]=updated[m]});
            localStorage.setItem('sche_last_update',remoteTime);
            localStorage.setItem('sche_data_version',remoteVersion);
            saveState();render();
            showToast('✅ 已更新到最新数据（'+data.courses.length+'门课程）');
          });
        }else showToast('已是最新数据');
      }else showToast('暂无新数据');
    }).catch(()=>showToast('当前离线，无法检查更新'));
}

// ==================== 恢复默认 ====================
function resetData(){
  closeMoreMenu();
  showConfirm('恢复默认','确定要恢复默认课表吗？所有自定义和删除操作将被清除。',()=>{
    state.customCourses=[];state.deletedCourses=[];state.dayOverrides={};
    saveState();render();showToast('已恢复默认课表');
  });
}

// ==================== 截图 ====================
function takeScreenshot(){
  closeMoreMenu();
  showToast('正在生成截图...');
  function doCapture(canvas){
    const dataUrl=canvas.toDataURL('image/png');
    if(window.Capacitor&&window.Capacitor.Plugins){
      const {Share,Filesystem}=window.Capacitor.Plugins;
      // 方案1: 用Filesystem写入Cache，再用Share分享（用户可选保存到相册）
      const base64=dataUrl.split(',')[1];
      const fileName='课表_'+state.selectedWeek+'周_'+Date.now()+'.png';
      Filesystem.writeFile({path:fileName,data:base64,directory:'Cache',encoding:'base64'}).then(result=>{
        if(Share&&Share.share){
          return Share.share({
            title:'🐔🩸课表截图',
            text:'第'+state.selectedWeek+'周课表截图',
            url:result.uri,
            dialogTitle:'保存课表截图'
          }).then(()=>showToast('✅ 已打开分享，选择保存到相册'))
            .catch(()=>showToast('截图已保存到缓存目录'));
        }else{
          showToast('截图已保存到缓存目录');
        }
      }).catch(err=>{
        console.error(err);
        fallbackDownload(dataUrl,fileName);
      });
      return;
    }
    fallbackDownload(dataUrl,'课表_'+state.selectedWeek+'周.png');
  }
  function fallbackDownload(dataUrl,name){
    const link=document.createElement('a');
    link.download=name;link.href=dataUrl;link.click();
    showToast('📷 截图已下载');
  }
  if(typeof html2canvas!=='undefined'){
    html2canvas(document.getElementById('scheduleTable'),{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(doCapture);
  }else{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>takeScreenshot();s.onerror=()=>showToast('截图库加载失败，请检查网络');
    document.head.appendChild(s);
  }
}

  loadState();
  state.selectedWeek=getCurrentWeek();
  saveState();
  render();
  setInterval(updateTimeLine,30000);
  updateTimeLine();
}
document.addEventListener('DOMContentLoaded',init);
