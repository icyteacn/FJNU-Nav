<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>🩸 课表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      -webkit-user-select: none;
      user-select: none;
    }
    .header {
      background: linear-gradient(135deg, #c62828, #8e0000);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon:active { background: rgba(255,255,255,0.3); }
    .mode-toggle {
      display: flex;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: white;
      color: #c62828;
      font-weight: 600;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255,255,255,0.9);
    }
    .filter-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    .filter-btn.active { background: white; color: #c62828; }
    .major-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .major-chips::-webkit-scrollbar { display: none; }
    .major-chip {
      padding: 6px 12px;
      border-radius: 16px;
      border: 1.5px solid rgba(255,255,255,0.5);
      background: transparent;
      color: white;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .major-chip.active {
      background: white;
      color: #c62828;
      font-weight: 600;
      border-color: white;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #eee;
    }
    .week-nav button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .week-nav button:active { background: #f5f5f5; }
    .week-info { text-align: center; }
    .week-num { font-size: 16px; font-weight: 600; }
    .week-date { font-size: 11px; color: #888; }
    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .schedule-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      background: white;
    }
    .schedule-table th, .schedule-table td {
      border: 1px solid #eee;
      padding: 4px;
      text-align: center;
      font-size: 11px;
    }
    .schedule-table th {
      background: #fafafa;
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: 600;
    }
    .schedule-table th.time-col { width: 50px; }
    .schedule-table th.day-col { width: calc((100% - 50px) / 7); }
    .schedule-table td.time-cell {
      background: #fafafa;
      font-weight: 500;
      color: #666;
      white-space: nowrap;
    }
    .schedule-table td.time-cell .period-num { font-weight: 700; color: #333; }
    .schedule-table td.time-cell .period-time { font-size: 9px; color: #999; }
    .course-cell {
      min-height: 50px;
      vertical-align: top;
      cursor: pointer;
      position: relative;
    }
    .course-card {
      background: linear-gradient(135deg, var(--course-color), color-mix(in srgb, var(--course-color) 80%, black));
      color: white;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      line-height: 1.3;
      text-align: left;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .course-card .name { font-weight: 600; font-size: 11px; }
    .course-card .location { opacity: 0.9; }
    .course-card .teacher { opacity: 0.8; font-size: 9px; }
    .course-cell.today { background: #fff3e0; }
    .course-cell.empty { cursor: pointer; }
    .course-cell.empty:hover { background: #f5f5f5; }
    .holiday-cell {
      background: linear-gradient(135deg, #ffebee, #ffcdd2);
      color: #c62828;
      font-weight: 600;
      font-size: 10px;
    }
    .makeup-cell {
      background: linear-gradient(135deg, #fff8e1, #ffecb3);
      color: #f57f17;
      font-weight: 600;
      font-size: 10px;
    }
    .fab {
      position: fixed;
      right: 16px;
      bottom: calc(24px + var(--safe-bottom));
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, #c62828, #8e0000);
      color: white;
      border: none;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(198,40,40,0.4);
      cursor: pointer;
      z-index: 50;
    }
    .fab:active { transform: scale(0.95); }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal {
      background: white;
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: calc(20px + var(--safe-bottom));
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: #999;
      cursor: pointer;
    }
    .form-group { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #c62828; color: white; }
    .btn-danger { background: #ef5350; color: white; }
    .btn-outline { background: white; border: 1px solid #ddd; color: #333; }
    .btn-block { width: 100%; }
    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 300;
      white-space: nowrap;
    }
    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .schedule-table { min-width: 100%; }
      .schedule-table th, .schedule-table td { padding: 2px; font-size: 10px; }
    }
  </style>
</head>

  <div id="app">
    <div class="header">
      <div class="header-top">
        <h1>🩸 课表</h1>
        <div class="header-actions">
          <button class="btn-icon" onclick="exportJSON()" title="导出">📤</button>
          <button class="btn-icon" onclick="importJSON()" title="导入">📥</button>
          <button class="btn-icon" onclick="saveScreenshot()" title="截图">📸</button>
        </div>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" onclick="setMode('page')">页面版</button>
        <button class="mode-btn" onclick="setMode('table')">纯课表</button>
      </div>
      <div class="search-box" id="searchBox">
        <input type="text" class="search-input" placeholder="搜索课程..." id="searchInput" oninput="renderSchedule()">
        <button class="filter-btn" onclick="toggleFilter()" id="filterBtn">筛选</button>
      </div>
      <div class="major-chips" id="majorChips"></div>
    </div>

    <div class="week-nav" id="weekNav">
      <button onclick="prevWeek()">‹ 上周</button>
      <div class="week-info">
        <div class="week-num" id="weekNum">第1周</div>
        <div class="week-date" id="weekDate"></div>
      </div>
      <button onclick="nextWeek()">下周 ›</button>
    </div>

    <div class="table-container" id="tableContainer">
      <table class="schedule-table" id="scheduleTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <button class="fab" onclick="showAddModal()">+</button>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

    // ===== 工具函数 =====
    const SEMESTER_START = new Date('2026-08-31');
    const STORAGE_KEY = 'feike_custom_courses';
    const OVERRIDES_KEY = 'feike_day_overrides';

    function getCurrentWeekNum() {
      const now = new Date();
      const diff = Math.floor((now - SEMESTER_START) / 86400000);
      return Math.max(1, Math.min(18, Math.floor(diff / 7) + 1));
    }

    function getWeekStartDate(week) {
      const d = new Date(SEMESTER_START);
      d.setDate(d.getDate() + (week - 1) * 7);
      return d;
    }

    function formatDate(d) {
      return `${d.getMonth() + 1}.${d.getDate()}`;
    }

    function isCourseInWeek(course, week) {
      if (!course.weeks) return true;
      const [s, e] = course.weeks.split('-').map(Number);
      if (week < s || week > e) return false;
      if (course.weekdayType === 'odd') return week % 2 === 1;
      if (course.weekdayType === 'even') return week % 2 === 0;
      return true;
    }

    function getDateStr(week, weekday) {
      const d = getWeekStartDate(week);
      d.setDate(d.getDate() + weekday - 1);
      return d.toISOString().slice(0, 10);
    }

    function isHoliday(dateStr) {
      return HOLIDAY_MAP[dateStr]?.type === 'holiday';
    }

    function isMakeup(dateStr) {
      return HOLIDAY_MAP[dateStr]?.type === 'makeup';
    }

    function getScheduleWeekday(dateStr, originalWeekday) {
      const info = HOLIDAY_MAP[dateStr];
      if (!info) return originalWeekday;
      if (info.type === 'holiday') return null;
      if (info.type === 'makeup') return info.scheduleWeekday;
      return originalWeekday;
    }

    function getTodayInfo() {
      const today = new Date();
      const diff = Math.floor((today - SEMESTER_START) / 86400000);
      const week = Math.floor(diff / 7) + 1;
      if (week < 1 || week > 18) return null;
      const monday = getWeekStartDate(week);
      const dayOfWeek = today.getDay();
      const weekday = dayOfWeek === 0 ? 7 : dayOfWeek;
      return { week, weekday };
    }

    // ===== 存储 =====
    function loadUserCourses() {
      try {
        userCourses = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch { userCourses = []; }
    }

    function saveUserCourses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userCourses));
    }

    function loadOverrides() {
      try {
        return JSON.parse(localStorage.getItem(OVERRIDES_KEY) || '{}');
      } catch { return {}; }
    }

    function saveOverrides(ov) {
      localStorage.setItem(OVERRIDES_KEY, JSON.stringify(ov));
    }

    // ===== 渲染 =====
    function renderMajorChips() {
      const el = document.getElementById('majorChips');
      el.innerHTML = MAJORS.map(m =>
        `<button class="major-chip ${m.key === currentMajor ? 'active' : ''}" 
          style="border-color:${m.color};${m.key === currentMajor ? `background:white;color:${m.color}` : ''}"

      ).join('');
    }

    function renderWeekNav() {
      document.getElementById('weekNum').textContent = `第${currentWeek}周`;
      const start = getWeekStartDate(currentWeek);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      document.getElementById('weekDate').textContent = `${formatDate(start)} - ${formatDate(end)}`;
    }

    function getAllCoursesForMajor(major) {
      return [...COURSES.filter(c => c.major === major), ...userCourses.filter(c => c.major === major)];
    }

    function getFilteredCourses() {
      let courses = getAllCoursesForMajor(currentMajor);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        courses = courses.filter(c =>
          c.name.toLowerCase().includes(q) ||
          c.teacher.toLowerCase().includes(q) ||
          c.location.toLowerCase().includes(q)
        );
      }
      if (currentFilter !== 'all') {
        courses = courses.filter(c => c.category === currentFilter);
      }
      return courses;
    }

    function renderSchedule() {
      searchQuery = document.getElementById('searchInput').value.trim();
      const courses = getFilteredCourses();
      const todayInfo = getTodayInfo();

      // 表头
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '<tr><th class="time-col">节次</th>' +
        WEEKDAYS.map(w => {
          const dateStr = getDateStr(currentWeek, w.key);
          let cls = 'day-col';
          let suffix = '';
          if (todayInfo && todayInfo.week === currentWeek && todayInfo.weekday === w.key) {
            cls += ' today';
            suffix = ' (今)';
          }
          if (isHoliday(dateStr)) {
            cls += ' holiday-th';
            suffix = ` ${HOLIDAY_MAP[dateStr].icon}`;
          }
          if (isMakeup(dateStr)) {
            cls += ' makeup-th';
            suffix = ` ${HOLIDAY_MAP[dateStr].icon}`;
          }
          return `<th class="${cls}" onclick="showDayOverride('${dateStr}')">${w.short}${suffix}</th>`;
        }).join('') + '</tr>';

      // 表体
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = TABLE_ROWS.map(row => {
        return '<tr>' +
          `<td class="time-cell"><div class="period-num">${row.label}</div><div class="period-time">${row.time}</div></td>` +
          WEEKDAYS.map(w => {
            const dateStr = getDateStr(currentWeek, w.key);

            // 停课
            if (isHoliday(dateStr)) {
              return `<td class="holiday-cell" rowspan="${row.period === 1 ? 12 : 0}" ${row.period > 1 ? 'style="display:none"' : ''}>🎉<br>${HOLIDAY_MAP[dateStr].name}<br>停课</td>`;
            }

            // 调休
            if (isMakeup(dateStr)) {
              return `<td class="makeup-cell" onclick="showDayOverride('${dateStr}')">📅<br>${HOLIDAY_MAP[dateStr].descShort || '调休'}</td>`;
            }

            // 查找课程
            const schedWd = getScheduleWeekday(dateStr, w.key);
            const course = courses.find(c =>
              c.weekday === schedWd &&
              row.period >= c.startPeriod &&
              row.period <= c.endPeriod &&
              isCourseInWeek(c, currentWeek) &&
              row.period === c.startPeriod
            );

            if (course) {
              const span = course.endPeriod - course.startPeriod + 1;
              const isToday = todayInfo && todayInfo.week === currentWeek && todayInfo.weekday === w.key;
              return `<td class="course-cell ${isToday ? 'today' : ''}" rowspan="${span}" onclick="showCourseDetail('${course.id}', '${course.major}', ${course.isCustom || false})" style="--course-color:${course.color}">
                <div class="course-card">
                  <div class="name">${course.name}</div>
                  <div class="location">📍${course.location}</div>
                  <div class="teacher">👤${course.teacher}</div>
                </div>
              </td>`;
            }

            // 被合并的格子
            const isInSpan = courses.some(c =>
              c.weekday === w.key &&
              row.period > c.startPeriod &&
              row.period <= c.endPeriod &&
              isCourseInWeek(c, currentWeek)
            );
            if (isInSpan) return '';

            const isToday = todayInfo && todayInfo.week === currentWeek && todayInfo.weekday === w.key;
            return `<td class="course-cell ${isToday ? 'today' : ''} empty" onclick="showAddModal(${w.key}, ${row.period})"></td>`;
          }).join('') +
          '</tr>';
      }).join('');
    }

      if (Math.abs(diff) > 60) {

      }

        document.body.appendChild(overlay);

      overlay.innerHTML = `<div class="modal">${html}</div>`;

        teacher: document.getElementById('f-teacher').value.trim(),
        location: document.getElementById('f-location').value.trim(),

        color: document.getElementById('f-color').value,
        major: currentMajor,
        credits: 0,
        hours: 0,
        isCustom: true

      if (course.endPeriod < course.startPeriod) { showToast('结束节次不能小于开始节次'); return; }

      hideModal();
      renderSchedule();
      showToast(editingCourse ? '课程已更新' : '课程已添加');

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">

      `);
    }

    function setOverride(dateStr, ov) {
      const overrides = loadOverrides();
      overrides[dateStr] = ov;
      saveOverrides(overrides);
      hideModal();
      renderSchedule();
      showToast('已更新');
    }

    function clearOverride(dateStr) {
      const overrides = loadOverrides();
      delete overrides[dateStr];
      saveOverrides(overrides);
      hideModal();
      renderSchedule();
      showToast('已恢复默认');
    }

    // ===== 截图 =====
    function saveScreenshot() {
      if (typeof html2canvas === 'undefined') {
        showToast('html2canvas 未加载，请检查网络');
        return;
      }
      const el = document.getElementById('tableContainer');
      html2canvas(el, { backgroundColor: '#fff', scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `课表_${currentMajor}_第${currentWeek}周.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('截图已保存');
      });
    }

    // ===== 导入/导出 =====
    function exportJSON() {
      const data = {
        version: 1,
        major: currentMajor,
        week: currentWeek,
        customCourses: userCourses,
        overrides: loadOverrides()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = `课表备份_${new Date().toISOString().slice(0, 10)}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
      showToast('导出成功');
    }

    function importJSON() {
      document.getElementById('fileInput').click();
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.customCourses) {
            userCourses = data.customCourses;
            saveUserCourses();
          }
          if (data.overrides) {
            saveOverrides(data.overrides);
          }
          if (data.major) currentMajor = data.major;
          if (data.week) currentWeek = data.week;
          renderMajorChips();
          renderWeekNav();
          renderSchedule();
          showToast('导入成功');
        } catch {
          showToast('导入失败：文件格式错误');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // ===== 初始化 =====
    loadUserCourses();
    currentWeek = getCurrentWeekNum();
    renderMajorChips();
    renderWeekNav();
    renderSchedule();
  </script>
</body>
</html>
